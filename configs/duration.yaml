# Speech rate fitted to the full ep00 pilot render (2026-10-10, production pipeline:
# instruction prefix, normalised voice refs, plain spoken forms): 34 lines, 734 words,
# 318.9 s of speech -> 138.1 words per minute. Predicts the episode at 337.9 s
# (actual 337.9 s); mean absolute line error 1.24 s.
# History: the prototype excerpt (proto/excerpt_100.json, no instruction prefix) gave
# 250 words / 93.25 s = 160.9 wpm; that under-predicted the pilot by 45 s.
wpm: 138.1
gaps:
  same_speaker_s: 0.25
  speaker_change_s: 0.50
  paragraph_s: 1.50
  segment_s: 1.50
engine:
  name: voxcpm2
  steps: 10
  cfg_value: 2.0
  sample_rate: 48000
loudness:
  integrated_lufs: -16
  true_peak_db: -1.5
# Translator glosses in parentheses are removed from TTS text only.
# An episode YAML or a line override can set strip_glosses false.
strip_glosses: true
