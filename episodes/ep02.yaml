summary: >
  Sauti tells the story of the Bharata in brief: Vyasa fathers Dhritarashtra, Pandu and Vidura; how the Bharata was
  compiled and handed down; Pandu's misfortune in the forest and the birth of the five Pandavas; the Munis present
  them at Hastinapura to the citizens' joy and a rain of flowers; Arjuna wins Draupadi; Indraprastha and the
  Rajasuya; Duryodhana's envy, the game of dice, and the war.
