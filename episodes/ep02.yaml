summary: >
  Sauti tells the story of the Bharata in brief: Vyasa fathers Dhritarashtra, Pandu and Vidura; Pandu's curse in the
  forest and the birth of the five Pandavas; their welcome at Hastinapura; Draupadi; Indraprastha and the Rajasuya;
  Duryodhana's envy and the game of dice that led to the war. Then the blind king Dhritarashtra, hearing of the
  Pandavas' success, pours out his lament to Sanjaya ("When I heard..., then, O Sanjaya, I had no hope of success"),
  faints, and is consoled by Sanjaya with the deaths of the great kings of old and the power of Time.
end_reason: >
  Sauti closes the scene ("The son of Gavalgana having in this manner administered comfort to the royal
  Dhritarashtra... then restored his mind to peace. Taking these facts for his subject, Dwaipayana composed a holy
  Upanishad"). It is the end of the Dhritarashtra–Sanjaya dialogue and a narration boundary. ¶41 turns to the merits of
  reading the Bharata.
notes:
