  text: 'And so the blind king went on, recounting all that he had heard: how Arjuna won Draupadi and Subhadra; how Yudhishthira
    was beaten at the dice and Draupadi dragged before the court; the exile in the forest and the year in Virata''s city;
    Krishna''s embassy of peace refused; and then the war, Bhishma on his bed of arrows, the boy Abhimanyu slain, Drona, Karna
    and Salya fallen, Duryodhana struck down by the lake, and the sleeping Panchalas slain by the son of Drona. And at every
    turn he said: then, O Sanjaya, I had no hope of success.'
  note: 'NON-KMG: replaces §1 ¶32-33 (65 ''When I heard...'' stanzas, ~18 min); written only from what those stanzas say'
