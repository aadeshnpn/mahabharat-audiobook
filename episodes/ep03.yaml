summary: >
  Hearing of the Pandavas' success, the blind king Dhritarashtra pours out his lament to his minister Sanjaya: his
  self-justification, then the refrain "When I heard..., then, O Sanjaya, I had no hope of success" through every
  turn of the story and the war, and "Alas!". He faints and wishes to die. Sanjaya consoles him with the great kings
  of old, who also died, and with the power of Time; Sauti closes the scene.
end_reason: >
  Sauti closes the scene ("The son of Gavalgana having in this manner administered comfort to the royal
  Dhritarashtra... then restored his mind to peace. Taking these facts for his subject, Dwaipayana composed a holy
  Upanishad"). It is the end of the Dhritarashtra–Sanjaya dialogue; ¶41 turns to the merits of reading the Bharata.
notes:
  - "Unabridged KMG, §1 ¶30–40 in order; only parenthetical glosses are not spoken (strip_glosses)."
  - "Long by design (user choice A1): ¶31–35 is one unbroken ~20 min speech; there is no clean break inside it."
