summary: >
  Sauti closes the Introduction with the merits of hearing the Bharata and how it outweighed the four Vedas, hence
  "Mahabharata". The Naimisha Rishis ask about Samanta-panchaka: Parasurama's five lakes of blood, his ancestors'
  boon, and the eighteen Akshauhinis who later died there. Sauti defines an Akshauhini, then lists the hundred parvas.
end_reason: >
  §2 ¶8 ends the full list of the hundred parvas ("...the very wonderful Bhavishyaparva"); ¶9 is a bridge ("as
  follows:") into the eighteen-parva summary, which begins a new long catalogue.
