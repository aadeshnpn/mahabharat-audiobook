  - {name: stri_blows,      match: {section: 2, paragraph: 20, text: 'statue of hard iron|Then the wrath of Gandhari|lying dead|the cremation'}, cue: grave_drone, intensity: 0.45}
  - {name: stri_lament,     match: {section: 2, paragraph: 20},                                              cue: tender_resolve, intensity: 0.4}
summary: >
  Sauti continues the eighteen-parva summary: Virata (the year in disguise, Kichaka, the cattle
  raids, Uttara and Abhimanyu), Udyoga (Krishna's offer, Salya, the peace embassy, the march),
  then the war books Bhishma, Drona, Karna and Salya, the night attack in Sauptika, and the
  Stri parva, the lament of the women, through its sloka count.
end_reason: >
  §2 ¶20 closes the Stri (eleventh) parva with its sloka count ("...seven hundred and seventy-five").
  From §2 ¶13 at a target of 1080 s, `mbh episode breaks` ranks a mid-¶20 sentence first (1075 s,
  during the cremation) and this paragraph boundary second, a third of a point behind (1110 s).
  The paragraph boundary is between parvas, in narration, on a complete sentence. ¶19 (Sauptika)
  ends at 996 s, inside the window but well short of the target. ¶21 opens the Santi parva and,
  with the v6 sting, pushes the file past 20 minutes. Santi starts Ep 7.
