  - {name: drona_abhimanyu, match: {section: 2, paragraph: 16, text: 'Abhimanyu|Jayadratha|Narayana'},        cue: grave_drone,    intensity: 0.5}
  - {name: drona_parva,     match: {section: 2, paragraph: 16},                                              cue: grave_drone,    intensity: 0.4}
